name: 'build-windows'

# Cách chạy: vào tab Actions trên GitHub, chọn workflow "build-windows",
# bấm "Run workflow" (nhánh main) — hoặc push code lên nhánh "release".
on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  build-windows:
    permissions:
      contents: write

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'T&T Nhân Số Học App v__VERSION__'
          releaseBody: 'Bản cài đặt Windows (.exe) — tải file "*-setup.exe" bên dưới để cài.'
          releaseDraft: true
          prerelease: false
          args: --bundles nsis
